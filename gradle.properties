# Project-wide Gradle settings. Keep machine-specific paths (JDK, SDK) out of this file:
# set JAVA_HOME per command and sdk.dir in local.properties.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
