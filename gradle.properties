# Project-wide Gradle settings. Keep machine-specific paths (JDK, SDK) out of this file:
# set JAVA_HOME per command and sdk.dir in local.properties.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Published coordinates of the design system (proposal 0004 step 3): com.halo:designsystem:<version>.
HALO_GROUP=com.halo
HALO_VERSION=0.1.0
# Public-API guard (apiCheck in `check`): off while components are still being designed; true from the first release.
HALO_API_CHECK=false
